apiVersion: batch/v1
kind: Job
metadata:
  name: cis_3_2_5
  namespace: kube-system
spec:
  template:
    spec:
      serviceAccountName: cluster-admin-sa
      restartPolicy: Never
      containers:
      - name: cis_3_2_5
        image: bitnami/kubectl:latest
        command:
          - /bin/sh
          - -c
          - |
            echo "=== CIS 3.2.5 - Ensure that the --streaming-connection-idle-timeout argument is not set to 0"

            NODES=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')

            for NODE in $NODES; do
              echo "---- Node: $NODE ----"

              RAW=$(kubectl get --raw /api/v1/nodes/$NODE/proxy/configz 2>/dev/null || echo "")

              if [ -z "$RAW" ]; then
                echo "[INFO] /configz not accessible for $NODE. Assuming EKS defaults."
                echo "[PASS] streamingConnectionIdleTimeout default is not 0"
                continue
              fi

              TIMEOUT=$(echo "$RAW" | jq -r '.kubeletconfig.streamingConnectionIdleTimeout // empty')

        
              if [ -z "$TIMEOUT" ] || [ "$TIMEOUT" = "null" ]; then
                echo "[PASS] streamingConnectionIdleTimeout not set (uses safe default)"
                continue
              fi


              if [ "$TIMEOUT" = "0" ] || [ "$TIMEOUT" = "0s" ] || [ "$TIMEOUT" = "0m" ] || [ "$TIMEOUT" = "0h" ]; then
                echo "[FAIL] streamingConnectionIdleTimeout=$TIMEOUT (must not be 0)"
              else
                echo "[PASS] streamingConnectionIdleTimeout=$TIMEOUT"
              fi

            done

            echo "Audit complete"
      nodeSelector:
        kubernetes.io/os: linux

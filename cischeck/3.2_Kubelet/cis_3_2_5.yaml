apiVersion: batch/v1
kind: Job
metadata:
  name: kubelet-streaming-timeout-audit
  namespace: kube-system
spec:
  template:
    spec:
      serviceAccountName: cluster-admin-sa
      restartPolicy: Never
      containers:
      - name: kubelet-streaming-timeout-audit
        image: bitnami/kubectl:latest
        command:
          - /bin/sh
          - -c
          - |
            echo "Starting Kubelet Streaming Timeout Audit"

            NODES=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')

            for NODE in $NODES; do
              echo "---- Node: $NODE ----"

              RAW=$(kubectl get --raw /api/v1/nodes/$NODE/proxy/configz 2>/dev/null || echo "")

              if [ -z "$RAW" ]; then
                echo "[INFO] /configz not accessible for $NODE. Assuming EKS defaults."
                echo "[PASS] streamingConnectionIdleTimeout default is not 0"
                continue
              fi

              TIMEOUT=$(echo "$RAW" | jq -r '.kubeletconfig.streamingConnectionIdleTimeout // empty')

              # CASE 1: Không có trường
              if [ -z "$TIMEOUT" ] ||

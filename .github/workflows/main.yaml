name: specializedProjects

on: 
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - main 
    
env:
  AWS_REGION: ap-southeast-1
  AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
  #Dung cho bucket luu tfstate
  BUCKET_TF_STATE: ${{secrets.BUCKET_TF_STATE}}
  EKS_CLUSTER: specialProject
  ECR_REPOSITORY: web-app
  CONTAINER_NAME: devopsproject


jobs:
  SetUp_Env:
    runs-on: ubuntu-latest
    name: "Apply Terraform code changes"
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.3"

      - name: Terraform init 
        id: init 
        run: terraform init -backend-config="bucket=$BUCKET_TF_STATE"
        #run: terraform init -backend=false

      - name: Terraform format
        id: fmt 
        run: terraform fmt -check 

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true
  
      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile
      
  Cis_Check:
    runs-on: ubuntu-latest
    name: "Cis benchmark check"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
    
      - name: 2.1 Logging
        run: |
             cd cischeck/2.1_Logging
             chmod +x enableAudit.sh
             ./enbleAudit.sh ${{env.EKS_CLUSTER}} ${{env.AWS_REGION}}

      - name: 3.1 Worker Node Configuration
        run: |
            cd cischeck/3.1_Worker_Node_Configuration
            chmod +x *.sh
            for f in *.sh; do
                echo "Running $f ..."
                ./$f
            done

        
        


     
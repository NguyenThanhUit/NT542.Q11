name: specializedProjects

on: 
  workflow_dispatch:
    inputs:
      ALLOWED_CIDR:
        description: Your Public IP
        required: false
        default: ''
        
  push:
    branches: ["main"]
  pull_request:
    branches:
      - main 
    

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
  BUCKET_TF_STATE: ${{secrets.BUCKET_TF_STATE}}
  EKS_CLUSTER: specialProject
  ECR_REPOSITORY: web-app
  CONTAINER_NAME: devopsproject

jobs:
  SetUp_Env:
    runs-on: ubuntu-latest
    name: "Apply Terraform code changes"
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.3"

      - name: Terraform init 
        id: init 
        run: terraform init -backend-config="bucket=$BUCKET_TF_STATE"

      - name: Terraform format
        id: fmt 
        run: terraform fmt -check 

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true
  
      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile
      

  Cis_Check:
    runs-on: ubuntu-latest
    name: "CIS Benchmark Check"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip curl
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --bin-dir /usr/local/bin --update

      # CIS 2.1 Logging
      - name: 2.1 Logging
        run: |
             cd cischeck/2.1_Logging
             chmod +x cis_2_1_1.sh
             ./cis_2_1_1.sh ${{env.EKS_CLUSTER}} ${{env.AWS_REGION}}

      # CIS 5.1 Image Registry
      - name: 5.1 Image Registry
        run: |
            cd cischeck/5.1_Image_Registry
            chmod +x cis_5_1_1.sh
            ./cis_5_1_1.sh ${{env.ECR_REPOSITORY}} ${{env.AWS_REGION}}

      # CIS 5.2 IAM
      - name: 5.2 IAM
        run: |
            cd cischeck/5.2_IAM
            chmod +x cis_5_2_1.sh
            ./cis_5_2_1.sh

      # CIS 5.4 Cluster Networking
      - name: 5.4.1 Restrict Control Plane Endpoint
        run: |
          cd cischeck/5.4_CLUSTER_NETWORKING
          chmod +x cis_5_4_1.sh
          ./cis_5_4_1.sh ${{ env.EKS_CLUSTER }} ${{ env.AWS_REGION }} ${{ github.event.inputs.ALLOWED_CIDR }}

      - name: 5.4.2 Private Endpoint Enabled, Public Disabled
        run: |
          cd cischeck/5.4_CLUSTER_NETWORKING
          chmod +x cis_5_4_2.sh
          ./cis_5_4_2.sh ${{ env.EKS_CLUSTER }} ${{ env.AWS_REGION }} ${{ github.event.inputs.ALLOWED_CIDR }}

      - name: 5.4.3 Ensure Private Nodes
        run: |
          cd cischeck/5.4_CLUSTER_NETWORKING
          chmod +x cis_5_4_3.sh
          ./cis_5_4_3.sh ${{ env.EKS_CLUSTER }} ${{ env.AWS_REGION }}

  Node_Cis_Check:
    runs-on: ubuntu-latest
    name: "CIS Worker Node Check"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Apply privileged pod
        run: |
          kubectl apply -f cischeck/file-pod-check.yaml

      - name: Wait for pod ready
        run: |
          kubectl wait --for=condition=Ready pod/cis-node-check --timeout=60s

      - name: Copy CIS scripts to pod
        run: |
          kubectl cp cischeck/3.1_kubelet/ cis-node-check:/tmp/cischeck/

      - name: Run Kubelet CIS scripts inside pod
        run: |
          kubectl exec cis-node-check -- sh -c "chmod +x /tmp/cischeck/*.sh && \
          /tmp/cischeck/cis_3_1_3_anonymous_auth.sh /host /host/etc/kubernetes/kubelet/config.json && \
          /tmp/cischeck/cis_3_2_2_authorization_mode.sh /host /host/etc/kubernetes/kubelet/config.json"

      - name: Cleanup privileged pod
        run: |
          kubectl delete -f cischeck/file-pod-check.yaml


